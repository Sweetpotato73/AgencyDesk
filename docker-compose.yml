services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal
      POSTGRES_DB: portal
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage for local development.
  # In production point S3_* env vars at AWS S3 or Cloudflare R2 instead.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: portal-minio
      MINIO_ROOT_PASSWORD: portal-minio-secret
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
